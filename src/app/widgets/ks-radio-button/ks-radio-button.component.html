<p-radioButton #radioButton [(ngModel)]="ngValue" [disabled]="disabled" [value]="value"
(onFocus)="onFocus($event)" (onBlur)="onBlur($event)"></p-radioButton>
@if (!!label) {
  <label (click)="onClick($event)" [ngClass]="{'faded': disabled}"
  [ngStyle]="{'cursor': disabled ? 'default' : 'pointer'}">{{label}}</label>
}
